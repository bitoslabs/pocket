# nginx static-site config. Put HTTPS/TLS in front of this server for PWA support.
# Install at /etc/nginx/sites-available/pocket.bitos.space
# then: ln -s /etc/nginx/sites-available/pocket.bitos.space /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pocket.bitos.space;

    root /var/www/pocket.bitos.space;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # The browser must fetch a new worker for each release. This must come
    # before the generic JS regex because nginx uses the first matching regex.
    location ~ ^/service-worker(?:\.[a-f0-9]+)?\.js$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # These URLs are reused on every release, so browsers must revalidate them.
    location ~* \.(?:html|css|js|json|svg|png)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
